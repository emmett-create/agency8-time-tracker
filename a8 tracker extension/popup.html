<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agency 8 Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <span class="header-title">Agency 8</span>
    <span class="header-sub">Time Tracker</span>
    <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
  </div>

  <div id="content">

    <!-- Not configured -->
    <div id="view-setup" class="hidden">
      <div class="setup-wrap">
        <div class="message">Open Settings to enter your name and Supabase credentials.</div>
        <button class="btn-secondary" id="btn-open-settings">Open Settings</button>
      </div>
    </div>

    <!-- Main timer view -->
    <div id="view-main" class="hidden">

      <div id="timer-display" class="timer-display">00:00:00</div>

      <div class="field">
        <label>Client</label>
        <select id="sel-client"></select>
      </div>

      <div class="field">
        <label>Task</label>
        <select id="sel-task"></select>
      </div>

      <div class="field">
        <label>Notes <span style="color:#444;font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
        <textarea id="txt-notes" rows="2" placeholder="What are you working on?"></textarea>
      </div>

      <button id="btn-timer" class="btn-start">Start Timer</button>

      <!-- Entries log -->
      <div class="section-header">
        <div id="day-tabs" class="day-tabs"></div>
        <span class="section-total" id="today-total"></span>
      </div>
      <div id="today-entries"></div>

      <a id="dashboard-link" href="#" target="_blank" class="dashboard-link">View Dashboard →</a>

    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
